name: Gerar instaladores e publicar release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Instalar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Instalar rpm-build (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Compilar e empacotar o jar
        run: mvn -B clean package

      - name: Determinar número da versão
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Preparar pasta de entrada do instalador
        shell: bash
        run: |
          rm -rf target/entrada
          mkdir -p target/entrada
          cp target/atividades-complementares.jar target/entrada/
          cp -r target/libs target/entrada/libs

      - name: Gerar instalador (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/instalador
          jpackage --input target/entrada --dest target/instalador \
            --name AtividadesComplementares --app-version "$APP_VERSION" \
            --main-jar atividades-complementares.jar \
            --main-class br.com.atividadescomplementares.ui.Launcher \
            --type deb --linux-shortcut
          jpackage --input target/entrada --dest target/instalador \
            --name AtividadesComplementares --app-version "$APP_VERSION" \
            --main-jar atividades-complementares.jar \
            --main-class br.com.atividadescomplementares.ui.Launcher \
            --type rpm --linux-shortcut

      - name: Gerar instalador (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p target/instalador
          jpackage --input target/entrada --dest target/instalador \
            --name AtividadesComplementares --app-version "$APP_VERSION" \
            --main-jar atividades-complementares.jar \
            --main-class br.com.atividadescomplementares.ui.Launcher \
            --type msi --win-shortcut --win-dir-chooser --win-console

      - name: Gerar instalador (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/instalador
          jpackage --input target/entrada --dest target/instalador \
            --name AtividadesComplementares --app-version "$APP_VERSION" \
            --main-jar atividades-complementares.jar \
            --main-class br.com.atividadescomplementares.ui.Launcher \
            --type dmg

      - name: Publicar artefatos da release
        uses: softprops/action-gh-release@v2
        with:
          files: target/instalador/*
